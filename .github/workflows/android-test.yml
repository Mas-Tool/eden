# Fork-only: builds a side-by-side test APK (dev.eden.eden_emulator.relWithDebInfo).
name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [vk-clear-unbound-rt]

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-36"

      - name: Build
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${NDK_VERSION}"
          .ci/android/build.sh -t standard -b RelWithDebInfo

      - uses: actions/upload-artifact@v4
        with:
          name: eden-mainline-relWithDebInfo-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
